name: Propose a test scenario
description: Add a realistic decision that could expose a weakness.
title: "Scenario: "
body:
  - type: textarea
    id: scenario
    attributes:
      label: Synthetic scenario
      description: Include evidence, founder constraints, and the question. No private business data.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: What would make an answer useful or harmful?
      description: Describe observable decisions rather than requiring exact wording.
    validations:
      required: true
